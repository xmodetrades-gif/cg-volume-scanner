<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CG Scanner" />
  <title>CoinGecko Volume Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link id="dynamic-manifest" rel="manifest" />
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="mb-6">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
          <h1 class="text-3xl font-bold">CoinGecko Volume Scanner</h1>
          <p class="text-slate-400 mt-2">Lista token aggiornata + dettaglio storico con market cap, volume e close quando selezioni una coin.</p>
        </div>
        <button id="installBtn" class="hidden bg-fuchsia-600 hover:bg-fuchsia-500 rounded-xl px-4 py-3 font-semibold">Installa app</button>
      </div>
      <div id="installStatus" class="text-slate-500 text-sm mt-3"></div>
    </div>

    <div class="grid lg:grid-cols-12 gap-6">
      <div class="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="flex flex-col gap-3">
          <input id="searchInput" type="text" placeholder="Cerca token o simbolo..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none" />
          <div class="grid grid-cols-2 gap-3">
            <select id="sortBy" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3">
              <option value="volume_desc">Volume desc</option>
              <option value="market_cap_desc">Market cap desc</option>
              <option value="volume_asc">Volume asc</option>
              <option value="market_cap_asc">Market cap asc</option>
            </select>
            <button id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-500 rounded-xl px-4 py-3 font-semibold">Aggiorna lista</button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <input id="minMcap" type="number" min="0" step="any" placeholder="Min market cap $" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none" />
            <input id="maxMcap" type="number" min="0" step="any" placeholder="Max market cap $" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <select id="daysSelect" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3">
              <option value="7">Storico 7g</option>
              <option value="14">Storico 14g</option>
              <option value="30" selected>Storico 30g</option>
              <option value="90">Storico 90g</option>
            </select>
            <button id="loadMoreBtn" class="bg-blue-600 hover:bg-blue-500 rounded-xl px-4 py-3 font-semibold">Carica altri</button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <button id="showAllBtn" class="bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold">Tutti</button>
            <button id="showFavBtn" class="bg-amber-600 hover:bg-amber-500 rounded-xl px-4 py-3 font-semibold">Preferiti</button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <select id="daysSelect" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3">
              <option value="7">Storico 7g</option>
              <option value="14">Storico 14g</option>
              <option value="30" selected>Storico 30g</option>
              <option value="90">Storico 90g</option>
            </select>
            <button id="loadMoreBtn" class="bg-blue-600 hover:bg-blue-500 rounded-xl px-4 py-3 font-semibold">Carica altri</button>
          </div>
        </div>

        <div id="listStatus" class="text-slate-400 text-sm mt-4"></div>

        <div id="tokenList" class="mt-4 space-y-2 max-h-[70vh] overflow-y-auto pr-1"></div>
      </div>

      <div class="lg:col-span-8 space-y-6">
        <div id="selectedHeader" class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
          <div class="text-slate-400">Seleziona un token dalla lista per vedere lo storico.</div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
          <div class="flex items-center justify-between gap-4 mb-4">
            <h2 class="text-xl font-bold">Storico dati</h2>
            <div id="tableStatus" class="text-slate-400 text-sm"></div>
          </div>
          <div class="overflow-auto rounded-xl border border-slate-800">
            <table class="min-w-full text-sm">
              <thead class="bg-slate-950 text-slate-300">
                <tr>
                  <th class="text-left px-4 py-3">Data</th>
                  <th class="text-right px-4 py-3">Cap. di mercato</th>
                  <th class="text-right px-4 py-3">Volume</th>
                  <th class="text-right px-4 py-3">Close</th>
                </tr>
              </thead>
              <tbody id="historyTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://api.coingecko.com/api/v3';
    let deferredPrompt = null;
    let allTokens = [];
    let page = 1;
    let currentSort = 'volume_desc';
    let selectedCoinId = null;
    let showFavoritesOnly = false;
    let favorites = JSON.parse(localStorage.getItem('cg_favorites') || '[]');

    const tokenListEl = document.getElementById('tokenList');
    const listStatusEl = document.getElementById('listStatus');
    const selectedHeaderEl = document.getElementById('selectedHeader');
    const historyTableBodyEl = document.getElementById('historyTableBody');
    const tableStatusEl = document.getElementById('tableStatus');
    const searchInputEl = document.getElementById('searchInput');
    const sortByEl = document.getElementById('sortBy');
    const daysSelectEl = document.getElementById('daysSelect');
    const refreshBtnEl = document.getElementById('refreshBtn');
    const loadMoreBtnEl = document.getElementById('loadMoreBtn');
    const installBtnEl = document.getElementById('installBtn');
    const installStatusEl = document.getElementById('installStatus');
    const minMcapEl = document.getElementById('minMcap');
    const maxMcapEl = document.getElementById('maxMcap');
    const showAllBtnEl = document.getElementById('showAllBtn');
    const showFavBtnEl = document.getElementById('showFavBtn');

    function setupPWA() {
      const manifest = {
        name: 'CoinGecko Volume Scanner',
        short_name: 'CG Scanner',
        start_url: '.',
        display: 'standalone',
        background_color: '#020617',
        theme_color: '#020617',
        icons: [
          {
            src: 'data:image/svg+xml;base64,' + btoa(`
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <rect width="512" height="512" rx="110" fill="#020617"/>
                <circle cx="170" cy="170" r="64" fill="#10b981"/>
                <circle cx="342" cy="170" r="64" fill="#f59e0b"/>
                <rect x="92" y="262" width="328" height="52" rx="26" fill="#2563eb"/>
                <rect x="92" y="340" width="252" height="52" rx="26" fill="#a855f7"/>
              </svg>
            `),
            sizes: '512x512',
            type: 'image/svg+xml',
            purpose: 'any maskable'
          }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      document.getElementById('dynamic-manifest').setAttribute('href', manifestUrl);

      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'cg-scanner-v1';
          const APP_SHELL = ['./'];
          self.addEventListener('install', event => {
            event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(APP_SHELL)).then(() => self.skipWaiting()));
          });
          self.addEventListener('activate', event => {
            event.waitUntil(self.clients.claim());
          });
          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;
            event.respondWith(
              fetch(event.request).then(response => {
                const clone = response.clone();
                caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone)).catch(() => {});
                return response;
              }).catch(() => caches.match(event.request).then(resp => resp || caches.match('./')))
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtnEl.classList.remove('hidden');
        installStatusEl.textContent = 'Puoi installare questa web app sulla home del telefono o del computer.';
      });

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        installBtnEl.classList.add('hidden');
        installStatusEl.textContent = 'App installata correttamente.';
      });
    }

    function formatCurrency(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return 'N/A';
      return new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 }).format(value) + ' $';
    }

    function formatPrice(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return 'N/A';
      return new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 8 }).format(value) + ' $';
    }

    function formatCompact(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return 'N/A';
      return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 2 }).format(value);
    }

    function saveFavorites() {
      localStorage.setItem('cg_favorites', JSON.stringify(favorites));
    }

    function isFavorite(id) {
      return favorites.includes(id);
    }

    function toggleFavorite(id) {
      if (isFavorite(id)) {
        favorites = favorites.filter(x => x !== id);
      } else {
        favorites.push(id);
      }
      saveFavorites();
      renderTokenList();
    }

    function renderTokenList() {
      const term = searchInputEl.value.trim().toLowerCase();
      const minMcap = minMcapEl.value ? Number(minMcapEl.value) : null;
      const maxMcap = maxMcapEl.value ? Number(maxMcapEl.value) : null;

      const filtered = allTokens.filter(token => {
        const matchesSearch = token.name.toLowerCase().includes(term) || token.symbol.toLowerCase().includes(term) || token.id.toLowerCase().includes(term);
        const tokenMcap = token.market_cap ?? 0;
        const matchesMin = minMcap === null || tokenMcap >= minMcap;
        const matchesMax = maxMcap === null || tokenMcap <= maxMcap;
        const matchesFav = !showFavoritesOnly || isFavorite(token.id);
        return matchesSearch && matchesMin && matchesMax && matchesFav;
      });

      tokenListEl.innerHTML = filtered.map(token => {
        const activeClass = selectedCoinId === token.id ? 'border-emerald-500 bg-slate-800' : 'border-slate-800 bg-slate-950';
        const fav = isFavorite(token.id);
        return `
          <div class="border ${activeClass} rounded-xl p-3 transition">
            <div class="flex items-start justify-between gap-3">
              <button data-coin-id="${token.id}" class="token-btn flex-1 text-left">
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <div class="font-semibold">${token.name} <span class="text-slate-400 uppercase">${token.symbol}</span></div>
                    <div class="text-xs text-slate-500 mt-1">${token.id}</div>
                  </div>
                  ${token.image ? `<img src="${token.image}" alt="${token.name}" class="w-8 h-8 rounded-full" />` : ''}
                </div>
                <div class="grid grid-cols-2 gap-2 mt-3 text-sm">
                  <div class="text-slate-400">Vol 24h <span class="text-white font-medium">${formatCompact(token.total_volume)}</span></div>
                  <div class="text-slate-400">MCap <span class="text-white font-medium">${formatCompact(token.market_cap)}</span></div>
                </div>
              </button>
              <button data-fav-id="${token.id}" class="fav-btn text-2xl leading-none px-2 ${fav ? 'text-amber-400' : 'text-slate-500'}" title="Preferito">${fav ? '★' : '☆'}</button>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.token-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const coinId = btn.getAttribute('data-coin-id');
          loadCoinHistory(coinId);
        });
      });

      document.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const coinId = btn.getAttribute('data-fav-id');
          toggleFavorite(coinId);
        });
      });

      listStatusEl.textContent = `${filtered.length} token visibili`;
      showAllBtnEl.className = showFavoritesOnly ? 'bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold' : 'bg-emerald-700 hover:bg-emerald-600 rounded-xl px-4 py-3 font-semibold';
      showFavBtnEl.className = showFavoritesOnly ? 'bg-amber-500 hover:bg-amber-400 rounded-xl px-4 py-3 font-semibold' : 'bg-amber-600 hover:bg-amber-500 rounded-xl px-4 py-3 font-semibold';
    }

    async function fetchMarkets(reset = false) {
      listStatusEl.textContent = 'Caricamento lista token...';
      try {
        if (reset) {
          page = 1;
          allTokens = [];
          tokenListEl.innerHTML = '';
        }

        currentSort = sortByEl.value;
        const url = `${API}/coins/markets?vs_currency=usd&order=${currentSort}&per_page=100&page=${page}&sparkline=false`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Errore richiesta lista token');
        const data = await response.json();

        const existingIds = new Set(allTokens.map(t => t.id));
        const unique = data.filter(t => !existingIds.has(t.id));
        allTokens = [...allTokens, ...unique];
        renderTokenList();
        listStatusEl.textContent = `Lista aggiornata. Pagina ${page} caricata`;
      } catch (error) {
        listStatusEl.textContent = 'Errore nel caricamento lista';
      }
    }

    async function fetchJsonWithRetry(url, options = {}) {
      const { retries = 1, retryDelay = 1200 } = options;
      let lastError = null;

      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const response = await fetch(url);

          if (response.status === 429) {
            throw new Error('RATE_LIMIT');
          }

          if (!response.ok) {
            throw new Error(`HTTP_${response.status}`);
          }

          return await response.json();
        } catch (error) {
          lastError = error;
          if (attempt < retries) {
            await new Promise(resolve => setTimeout(resolve, retryDelay));
          }
        }
      }

      throw lastError;
    }

    function getHistoryCacheKey(coinId, days) {
      return `cg_history_${coinId}_${days}`;
    }

    function saveHistoryToCache(coinId, days, data) {
      const payload = {
        savedAt: Date.now(),
        data
      };
      localStorage.setItem(getHistoryCacheKey(coinId, days), JSON.stringify(payload));
    }

    function loadHistoryFromCache(coinId, days, maxAgeMs = 1000 * 60 * 30) {
      try {
        const raw = localStorage.getItem(getHistoryCacheKey(coinId, days));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed?.savedAt || !parsed?.data) return null;
        if (Date.now() - parsed.savedAt > maxAgeMs) return null;
        return parsed.data;
      } catch {
        return null;
      }
    }

    function buildDailyRowsFromChartData(chartData) {
      const prices = Array.isArray(chartData?.prices) ? chartData.prices : [];
      const marketCaps = Array.isArray(chartData?.market_caps) ? chartData.market_caps : [];
      const volumes = Array.isArray(chartData?.total_volumes) ? chartData.total_volumes : [];

      if (!prices.length) {
        return [];
      }

      const rows = prices.map((pricePoint, index) => {
        const timestamp = pricePoint[0];
        const close = pricePoint[1];
        const mcap = marketCaps[index] ? marketCaps[index][1] : null;
        const vol = volumes[index] ? volumes[index][1] : null;
        return { timestamp, close, marketCap: mcap, volume: vol };
      });

      const dailyMap = new Map();
      rows.forEach(row => {
        const date = new Date(row.timestamp).toISOString().slice(0, 10);
        dailyMap.set(date, row);
      });

      return Array.from(dailyMap.entries())
        .map(([date, values]) => ({ date, ...values }))
        .sort((a, b) => b.timestamp - a.timestamp);
    }

    function renderHistoryRows(dailyRows) {
      historyTableBodyEl.innerHTML = dailyRows.map((row, idx) => `
        <tr class="${idx % 2 === 0 ? 'bg-slate-900' : 'bg-slate-950'} border-t border-slate-800">
          <td class="px-4 py-3">${row.date}</td>
          <td class="px-4 py-3 text-right">${formatCurrency(row.marketCap)}</td>
          <td class="px-4 py-3 text-right">${formatCurrency(row.volume)}</td>
          <td class="px-4 py-3 text-right">${formatPrice(row.close)}</td>
        </tr>
      `).join('');
    }

    async function loadCoinHistory(coinId) {
      selectedCoinId = coinId;
      renderTokenList();
      tableStatusEl.textContent = 'Caricamento storico...';
      historyTableBodyEl.innerHTML = '';

      try {
        const days = daysSelectEl.value;
        const marketData = await fetchJsonWithRetry(`${API}/coins/markets?vs_currency=usd&ids=${coinId}`, { retries: 1, retryDelay: 900 });
        if (!marketData.length) throw new Error('TOKEN_NOT_FOUND');
        const coin = marketData[0];

        selectedHeaderEl.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="flex items-center gap-3">
                ${coin.image ? `<img src="${coin.image}" alt="${coin.name}" class="w-12 h-12 rounded-full" />` : ''}
                <div>
                  <h2 class="text-2xl font-bold">${coin.name} <span class="text-slate-400 uppercase">${coin.symbol}</span></h2>
                  <div class="text-slate-500 text-sm">ID CoinGecko: ${coin.id}</div>
                </div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-slate-400 text-sm">Prezzo attuale</div>
              <div class="text-2xl font-bold">${formatPrice(coin.current_price)}</div>
            </div>
          </div>
          <div class="grid md:grid-cols-3 gap-4 mt-5">
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
              <div class="text-slate-400 text-sm">Market Cap</div>
              <div class="text-lg font-semibold mt-1">${formatCurrency(coin.market_cap)}</div>
            </div>
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
              <div class="text-slate-400 text-sm">Volume 24h</div>
              <div class="text-lg font-semibold mt-1">${formatCurrency(coin.total_volume)}</div>
            </div>
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
              <div class="text-slate-400 text-sm">Rank</div>
              <div class="text-lg font-semibold mt-1">#${coin.market_cap_rank ?? 'N/A'}</div>
            </div>
          </div>
        `;

        let chartData = null;
        let loadedFromCache = false;

        try {
          chartData = await fetchJsonWithRetry(`${API}/coins/${coinId}/market_chart?vs_currency=usd&days=${days}`, { retries: 1, retryDelay: 1500 });
          saveHistoryToCache(coinId, days, chartData);
        } catch (error) {
          const cached = loadHistoryFromCache(coinId, days);
          if (cached) {
            chartData = cached;
            loadedFromCache = true;
          } else {
            throw error;
          }
        }

        const dailyRows = buildDailyRowsFromChartData(chartData);

        if (!dailyRows.length) {
          throw new Error('NO_HISTORY');
        }

        renderHistoryRows(dailyRows);
        tableStatusEl.textContent = loadedFromCache
          ? `${dailyRows.length} righe storiche · cache locale`
          : `${dailyRows.length} righe storiche`;
      } catch (error) {
        let message = 'Impossibile caricare lo storico per questa coin.';

        if (error?.message === 'RATE_LIMIT') {
          message = 'CoinGecko ha limitato temporaneamente le richieste. Attendi qualche secondo e riprova.';
        } else if (error?.message === 'NO_HISTORY') {
          message = 'Storico non disponibile o dati troppo recenti per questa coin.';
        } else if (error?.message === 'TOKEN_NOT_FOUND') {
          message = 'Token non trovato su CoinGecko.';
        } else if (typeof error?.message === 'string' && error.message.startsWith('HTTP_')) {
          message = `Errore API ${error.message.replace('HTTP_', '')}. Riprova tra poco.`;
        }

        tableStatusEl.textContent = 'Storico non disponibile';
        historyTableBodyEl.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400">${message}</td></tr>`;
      }
    }

    refreshBtnEl.addEventListener('click', async () => {
      await installBtnEl.addEventListener('click', async () => {
      if (!deferredPrompt) {
        installStatusEl.textContent = 'Apri il menu del browser e usa “Aggiungi a schermata Home” se il pulsante di installazione non compare.';
        return;
      }
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (choice.outcome === 'accepted') {
        installStatusEl.textContent = 'Installazione avviata.';
      } else {
        installStatusEl.textContent = 'Installazione annullata.';
      }
      installBtnEl.classList.add('hidden');
    });

    setupPWA();
    fetchMarkets(true);
    });

    loadMoreBtnEl.addEventListener('click', async () => {
      page += 1;
      await fetchMarkets(false);
    });

    searchInputEl.addEventListener('input', renderTokenList);
    minMcapEl.addEventListener('input', renderTokenList);
    maxMcapEl.addEventListener('input', renderTokenList);
    showAllBtnEl.addEventListener('click', () => {
      showFavoritesOnly = false;
      renderTokenList();
    });
    showFavBtnEl.addEventListener('click', () => {
      showFavoritesOnly = true;
      renderTokenList();
    });

    sortByEl.addEventListener('change', async () => {
      await fetchMarkets(true);
    });

    daysSelectEl.addEventListener('change', async () => {
      if (selectedCoinId) {
        await loadCoinHistory(selectedCoinId);
      }
    });

    fetchMarkets(true);
  </script>
</body>
</html>

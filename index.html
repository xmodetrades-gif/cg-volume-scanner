<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CG Scanner" />
  <title>tradesbyxmode Token Scanner PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link id="dynamic-manifest" rel="manifest" />
</head>

<body class="bg-slate-950 text-white min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <header class="mb-6">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
          <h1 class="text-3xl font-bold tracking-tight">tradesbyxmode Token Scanner PRO</h1>
          <p class="text-slate-400 mt-2">
            Trading is about embracing the journey of self improvement.
          </p>
        </div>
        <button id="installBtn" class="hidden bg-fuchsia-600 hover:bg-fuchsia-500 rounded-xl px-4 py-3 font-semibold transition">Installa app</button>
      </div>
      <div id="installStatus" class="text-slate-500 text-sm mt-3"></div>
    </header>

    <main class="grid lg:grid-cols-12 gap-6">
      <aside class="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-2xl p-4 h-fit">
        <div class="flex flex-col gap-3">
          <input id="searchInput" type="text" placeholder="Cerca token, simbolo o ID..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-emerald-500" />

          <div class="grid grid-cols-2 gap-3">
            <select id="sortBy" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-emerald-500">
              <option value="volume_desc">Volume desc</option>
              <option value="market_cap_desc">Market cap desc</option>
              <option value="volume_asc">Volume asc</option>
              <option value="market_cap_asc">Market cap asc</option>
            </select>
            <button id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-500 rounded-xl px-4 py-3 font-semibold transition">Aggiorna lista</button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <input id="minMcap" type="number" min="0" step="any" placeholder="Min market cap $" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-emerald-500" />
            <input id="maxMcap" type="number" min="0" step="any" placeholder="Max market cap $" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-emerald-500" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <select id="daysSelect" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-emerald-500">
              <option value="7">Storico 7g</option>
              <option value="14">Storico 14g</option>
              <option value="30" selected>Storico 30g</option>
              <option value="90">Storico 90g</option>
            </select>
            <button id="loadMoreBtn" class="bg-blue-600 hover:bg-blue-500 rounded-xl px-4 py-3 font-semibold transition">Carica altri API</button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button id="showAllBtn" class="bg-emerald-700 hover:bg-emerald-600 rounded-xl px-4 py-3 font-semibold transition">Tutti</button>
            <button id="showFavBtn" class="bg-amber-600 hover:bg-amber-500 rounded-xl px-4 py-3 font-semibold transition">Preferiti</button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button id="smartLowCapBtn" class="bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold transition">Low Cap</button>
            <button id="smartVolumeBtn" class="bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold transition">High Vol/MCap</button>
          </div>
        </div>

        <div id="listStatus" class="text-slate-400 text-sm mt-4"></div>
        <div id="tokenList" class="mt-4 space-y-2 max-h-[70vh] overflow-y-auto pr-1"></div>
        <button id="showMoreLocalBtn" class="hidden mt-4 w-full bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold transition">Mostra altri risultati locali</button>
      </aside>

      <section class="lg:col-span-8 space-y-6">
        <div id="selectedHeader" class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
          <div class="text-slate-400">Seleziona un token dalla lista per vedere tutti i dettagli.</div>
        </div>

        <div id="tabBar" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-2">
          <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
            <button data-tab="overview" class="tab-btn bg-emerald-700 rounded-xl px-4 py-3 font-semibold">Overview</button>
            <button data-tab="statistics" class="tab-btn bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold">Statistics</button>
            <button data-tab="historical" class="tab-btn bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold">Historical</button>
            <button data-tab="contracts" class="tab-btn bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold">Contracts</button>
            <button data-tab="links" class="tab-btn bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold">Links</button>
          </div>
        </div>

        <div id="detailCards" class="space-y-6"></div>
      </section>
    </main>
  </div>

  <script>
    const API = 'https://api.coingecko.com/api/v3';
    const MARKET_CACHE_KEY = 'cg_markets_cache_v4';
    const MARKET_CACHE_MAX_AGE = 1000 * 60 * 10;
    const DETAIL_CACHE_MAX_AGE = 1000 * 60 * 30;
    const INITIAL_RENDER_LIMIT = 80;

    let deferredPrompt = null;
    let allTokens = [];
    let page = 1;
    let selectedCoinId = null;
    let selectedMarketCoin = null;
    let selectedFullCoin = null;
    let activeTab = 'overview';
    let showFavoritesOnly = false;
    let smartFilter = 'none';
    let visibleLimit = INITIAL_RENDER_LIMIT;
    let favorites = JSON.parse(localStorage.getItem('cg_favorites') || '[]');
    let lastFiltered = [];
    let searchTimer = null;

    const tokenListEl = document.getElementById('tokenList');
    const listStatusEl = document.getElementById('listStatus');
    const selectedHeaderEl = document.getElementById('selectedHeader');
    const detailCardsEl = document.getElementById('detailCards');
    const tabBarEl = document.getElementById('tabBar');
    const searchInputEl = document.getElementById('searchInput');
    const sortByEl = document.getElementById('sortBy');
    const daysSelectEl = document.getElementById('daysSelect');
    const refreshBtnEl = document.getElementById('refreshBtn');
    const loadMoreBtnEl = document.getElementById('loadMoreBtn');
    const installBtnEl = document.getElementById('installBtn');
    const installStatusEl = document.getElementById('installStatus');
    const minMcapEl = document.getElementById('minMcap');
    const maxMcapEl = document.getElementById('maxMcap');
    const showAllBtnEl = document.getElementById('showAllBtn');
    const showFavBtnEl = document.getElementById('showFavBtn');
    const showMoreLocalBtnEl = document.getElementById('showMoreLocalBtn');
    const smartLowCapBtnEl = document.getElementById('smartLowCapBtn');
    const smartVolumeBtnEl = document.getElementById('smartVolumeBtn');

    function setupPWA() {
      const manifest = {
        name: 'CoinGecko Token Scanner PRO',
        short_name: 'CG Scanner',
        start_url: '.',
        display: 'standalone',
        background_color: '#020617',
        theme_color: '#020617',
        icons: [{
          src: 'data:image/svg+xml;base64,' + btoa(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#020617"/><circle cx="170" cy="170" r="64" fill="#10b981"/><circle cx="342" cy="170" r="64" fill="#f59e0b"/><rect x="92" y="262" width="328" height="52" rx="26" fill="#2563eb"/><rect x="92" y="340" width="252" height="52" rx="26" fill="#a855f7"/></svg>`),
          sizes: '512x512',
          type: 'image/svg+xml',
          purpose: 'any maskable'
        }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('dynamic-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtnEl.classList.remove('hidden');
        installStatusEl.textContent = 'Puoi installare questa web app sulla home del telefono o del computer.';
      });
    }

    function escapeHtml(value) {
      return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function shortAddress(address) {
      if (!address) return 'N/A';
      if (address.length <= 14) return address;
      return `${address.slice(0, 6)}...${address.slice(-6)}`;
    }

    function formatCurrency(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return 'N/A';
      return new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 }).format(value) + ' $';
    }

    function formatPrice(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return 'N/A';
      const abs = Math.abs(Number(value));
      const maxDigits = abs < 0.01 ? 10 : abs < 1 ? 8 : 4;
      return new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: maxDigits }).format(value) + ' $';
    }

    function formatNumber(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return 'N/A';
      return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 3 }).format(value);
    }

    function formatCompact(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return 'N/A';
      return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 2 }).format(value);
    }

    function formatPercent(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return 'N/A';
      const sign = Number(value) > 0 ? '+' : '';
      return sign + Number(value).toFixed(2) + '%';
    }

    function formatDate(value) {
      if (!value) return 'N/A';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return 'N/A';
      return d.toLocaleDateString('it-IT', { year: 'numeric', month: 'short', day: '2-digit' });
    }

    function percentClass(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return 'text-slate-400';
      if (Number(value) > 0) return 'text-emerald-400';
      if (Number(value) < 0) return 'text-red-400';
      return 'text-slate-400';
    }

    function card(title, body) {
      return `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6"><h2 class="text-xl font-bold mb-5">${title}</h2>${body}</div>`;
    }

    function statItem(label, value, extra = '') {
      return `<div><div class="text-slate-400 text-sm">${label}</div><div class="text-white text-lg font-semibold mt-1">${value}</div>${extra ? `<div class="text-slate-500 text-xs mt-1">${extra}</div>` : ''}</div>`;
    }

    function getVolumeToMcap(token) {
      const mcap = Number(token.market_cap || 0);
      const volume = Number(token.total_volume || 0);
      if (!mcap || !volume) return null;
      return volume / mcap;
    }

    function getFdvRatio(token, full = null) {
      const mcap = Number(full?.market_data?.market_cap?.usd ?? token?.market_cap ?? 0);
      const fdv = Number(full?.market_data?.fully_diluted_valuation?.usd ?? token?.fully_diluted_valuation ?? 0);
      if (!mcap || !fdv) return null;
      return mcap / fdv;
    }

    function calculateTokenScore(token, full = null) {
      let score = 0;
      const mcap = Number(full?.market_data?.market_cap?.usd ?? token?.market_cap ?? 0);
      const volume = Number(full?.market_data?.total_volume?.usd ?? token?.total_volume ?? 0);
      const change24 = Number(token?.price_change_percentage_24h ?? 0);
      const change7 = Number(token?.price_change_percentage_7d_in_currency ?? 0);
      const change30 = Number(token?.price_change_percentage_30d_in_currency ?? 0);
      const ratio = getFdvRatio(token, full);
      const volMcap = mcap && volume ? volume / mcap : 0;
      const watchlist = Number(full?.community_data?.watchlist_portfolio_users ?? 0);

      if (mcap > 0 && mcap < 50_000_000) score += 15;
      else if (mcap < 250_000_000) score += 10;
      else if (mcap < 1_000_000_000) score += 5;

      if (volMcap > 0.5) score += 25;
      else if (volMcap > 0.25) score += 18;
      else if (volMcap > 0.1) score += 10;
      else if (volMcap > 0.03) score += 5;

      if (ratio !== null) {
        if (ratio > 0.7) score += 15;
        else if (ratio > 0.4) score += 10;
        else if (ratio > 0.2) score += 5;
      }

      if (change24 > 0) score += 5;
      if (change7 > 0) score += 8;
      if (change30 > 0) score += 8;
      if (change24 > 25) score -= 5;
      if (change7 > 100) score -= 10;
      if (watchlist > 10000) score += 10;
      else if (watchlist > 2000) score += 5;

      return Math.max(0, Math.min(100, Math.round(score)));
    }

    function scoreBadge(score) {
      const cls = score >= 70 ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40' : score >= 45 ? 'bg-amber-500/15 text-amber-300 border-amber-500/40' : 'bg-red-500/15 text-red-300 border-red-500/40';
      return `<span class="inline-flex items-center border ${cls} rounded-full px-3 py-1 text-sm font-bold">Score ${score}/100</span>`;
    }

    function saveFavorites() {
      localStorage.setItem('cg_favorites', JSON.stringify(favorites));
    }

    function isFavorite(id) {
      return favorites.includes(id);
    }

    function toggleFavorite(id) {
      favorites = isFavorite(id) ? favorites.filter(x => x !== id) : [...favorites, id];
      saveFavorites();
      renderTokenList();
    }

    function saveMarketsCache() {
      try {
        localStorage.setItem(MARKET_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), page, tokens: allTokens }));
      } catch {}
    }

    function loadMarketsCache() {
      try {
        const parsed = JSON.parse(localStorage.getItem(MARKET_CACHE_KEY) || 'null');
        if (!parsed?.tokens?.length) return false;
        allTokens = parsed.tokens;
        page = parsed.page || 1;
        renderTokenList();
        const ageMin = Math.round((Date.now() - parsed.savedAt) / 60000);
        listStatusEl.textContent = `Cache locale caricata · ${allTokens.length} token · ${ageMin} min fa. Aggiorno in background...`;
        return Date.now() - parsed.savedAt < MARKET_CACHE_MAX_AGE;
      } catch { return false; }
    }

    function getDetailCacheKey(coinId) {
      return `cg_detail_${coinId}`;
    }

    function saveDetailCache(coinId, data) {
      try { localStorage.setItem(getDetailCacheKey(coinId), JSON.stringify({ savedAt: Date.now(), data })); } catch {}
    }

    function loadDetailCache(coinId) {
      try {
        const parsed = JSON.parse(localStorage.getItem(getDetailCacheKey(coinId)) || 'null');
        if (!parsed?.savedAt || !parsed?.data) return null;
        if (Date.now() - parsed.savedAt > DETAIL_CACHE_MAX_AGE) return null;
        return parsed.data;
      } catch { return null; }
    }

    async function fetchJsonWithRetry(url, options = {}) {
      const { retries = 1, retryDelay = 1200 } = options;
      let lastError = null;
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const response = await fetch(url);
          if (response.status === 429) throw new Error('RATE_LIMIT');
          if (!response.ok) throw new Error(`HTTP_${response.status}`);
          return await response.json();
        } catch (error) {
          lastError = error;
          if (attempt < retries) await new Promise(resolve => setTimeout(resolve, retryDelay));
        }
      }
      throw lastError;
    }

    function getFilteredTokens() {
      const term = searchInputEl.value.trim().toLowerCase();
      const minMcap = minMcapEl.value ? Number(minMcapEl.value) : null;
      const maxMcap = maxMcapEl.value ? Number(maxMcapEl.value) : null;

      return allTokens.filter(token => {
        const matchesSearch = [token.name, token.symbol, token.id].some(v => String(v || '').toLowerCase().includes(term));
        const tokenMcap = token.market_cap ?? 0;
        const volMcap = getVolumeToMcap(token) || 0;
        const isLowCap = tokenMcap > 0 && tokenMcap <= 100_000_000;
        const isHighVolMcap = volMcap >= 0.2;
        const smartOk = smartFilter === 'none' || (smartFilter === 'lowcap' && isLowCap) || (smartFilter === 'highvol' && isHighVolMcap);

        return matchesSearch &&
          smartOk &&
          (minMcap === null || tokenMcap >= minMcap) &&
          (maxMcap === null || tokenMcap <= maxMcap) &&
          (!showFavoritesOnly || isFavorite(token.id));
      });
    }

    function renderTokenList() {
      lastFiltered = getFilteredTokens();
      const visible = lastFiltered.slice(0, visibleLimit);

      if (!visible.length) {
        tokenListEl.innerHTML = '<div class="text-slate-500 text-sm bg-slate-950 border border-slate-800 rounded-xl p-4">Nessun token trovato con questi filtri.</div>';
        listStatusEl.textContent = '0 token visibili';
        showMoreLocalBtnEl.classList.add('hidden');
        return;
      }

      tokenListEl.innerHTML = visible.map(token => {
        const activeClass = selectedCoinId === token.id ? 'border-emerald-500 bg-slate-800' : 'border-slate-800 bg-slate-950 hover:bg-slate-900';
        const fav = isFavorite(token.id);
        const score = calculateTokenScore(token);
        const volMcap = getVolumeToMcap(token);
        return `
          <div class="border ${activeClass} rounded-xl p-3 transition">
            <div class="flex items-start justify-between gap-3">
              <button data-coin-id="${escapeHtml(token.id)}" class="token-btn flex-1 text-left">
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <div class="font-semibold">${escapeHtml(token.name)} <span class="text-slate-400 uppercase">${escapeHtml(token.symbol)}</span></div>
                    <div class="text-xs text-slate-500 mt-1">${escapeHtml(token.id)}</div>
                  </div>
                  ${token.image ? `<img src="${escapeHtml(token.image)}" alt="${escapeHtml(token.name)}" class="w-8 h-8 rounded-full" loading="lazy" />` : ''}
                </div>
                <div class="grid grid-cols-2 gap-2 mt-3 text-sm">
                  <div class="text-slate-400">Vol 24h <span class="text-white font-medium">${formatCompact(token.total_volume)}</span></div>
                  <div class="text-slate-400">MCap <span class="text-white font-medium">${formatCompact(token.market_cap)}</span></div>
                  <div class="text-slate-400">24h <span class="${percentClass(token.price_change_percentage_24h)} font-medium">${formatPercent(token.price_change_percentage_24h)}</span></div>
                  <div class="text-slate-400">7d <span class="${percentClass(token.price_change_percentage_7d_in_currency)} font-medium">${formatPercent(token.price_change_percentage_7d_in_currency)}</span></div>
                  <div class="text-slate-400">Vol/MCap <span class="text-white font-medium">${volMcap ? formatPercent(volMcap * 100) : 'N/A'}</span></div>
                  <div class="text-slate-400">Rank <span class="text-white font-medium">#${token.market_cap_rank ?? 'N/A'}</span></div>
                </div>
                <div class="mt-3">${scoreBadge(score)}</div>
              </button>
              <button data-fav-id="${escapeHtml(token.id)}" class="fav-btn text-2xl leading-none px-2 ${fav ? 'text-amber-400' : 'text-slate-500'}" title="Preferito">${fav ? '★' : '☆'}</button>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.token-btn').forEach(btn => btn.addEventListener('click', () => selectCoin(btn.getAttribute('data-coin-id'))));
      document.querySelectorAll('.fav-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); toggleFavorite(btn.getAttribute('data-fav-id')); }));

      listStatusEl.textContent = `${visible.length}/${lastFiltered.length} visibili · ${allTokens.length} caricati · filtro ${smartFilter}`;
      showMoreLocalBtnEl.classList.toggle('hidden', visibleLimit >= lastFiltered.length);
      showAllBtnEl.className = showFavoritesOnly ? 'bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold transition' : 'bg-emerald-700 hover:bg-emerald-600 rounded-xl px-4 py-3 font-semibold transition';
      showFavBtnEl.className = showFavoritesOnly ? 'bg-amber-500 hover:bg-amber-400 rounded-xl px-4 py-3 font-semibold transition' : 'bg-amber-600 hover:bg-amber-500 rounded-xl px-4 py-3 font-semibold transition';
      smartLowCapBtnEl.className = smartFilter === 'lowcap' ? 'bg-purple-700 hover:bg-purple-600 rounded-xl px-4 py-3 font-semibold transition' : 'bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold transition';
      smartVolumeBtnEl.className = smartFilter === 'highvol' ? 'bg-purple-700 hover:bg-purple-600 rounded-xl px-4 py-3 font-semibold transition' : 'bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold transition';
    }

    async function fetchMarkets(reset = false, background = false) {
      if (!background) listStatusEl.textContent = 'Caricamento lista token...';
      try {
        if (reset) {
          page = 1;
          allTokens = [];
          visibleLimit = INITIAL_RENDER_LIMIT;
          tokenListEl.innerHTML = '';
        }
        const order = sortByEl.value;
        const url = `${API}/coins/markets?vs_currency=usd&order=${order}&per_page=100&page=${page}&sparkline=false&price_change_percentage=24h,7d,30d`;
        const data = await fetchJsonWithRetry(url, { retries: 1, retryDelay: 1200 });
        const existingIds = new Set(allTokens.map(t => t.id));
        allTokens = [...allTokens, ...data.filter(t => !existingIds.has(t.id))];
        saveMarketsCache();
        renderTokenList();
        listStatusEl.textContent = `Lista aggiornata · pagina ${page} caricata · ${allTokens.length} token totali`;
      } catch (error) {
        listStatusEl.textContent = error?.message === 'RATE_LIMIT' ? 'Rate limit CoinGecko. Uso cache locale se disponibile.' : 'Errore nel caricamento lista.';
      }
    }

    function renderHeader(coin) {
      selectedHeaderEl.innerHTML = `
        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
          <div class="flex items-center gap-3">
            ${coin.image ? `<img src="${escapeHtml(coin.image)}" alt="${escapeHtml(coin.name)}" class="w-12 h-12 rounded-full" />` : ''}
            <div>
              <h2 class="text-2xl font-bold">${escapeHtml(coin.name)} <span class="text-slate-400 uppercase">${escapeHtml(coin.symbol)}</span></h2>
              <div class="text-slate-500 text-sm">ID CoinGecko: ${escapeHtml(coin.id)} · Rank #${coin.market_cap_rank ?? 'N/A'}</div>
            </div>
          </div>
          <div class="md:text-right">
            <div class="text-slate-400 text-sm">Prezzo attuale</div>
            <div class="text-2xl font-bold">${formatPrice(coin.current_price)}</div>
            <div class="text-sm ${percentClass(coin.price_change_percentage_24h)}">24h ${formatPercent(coin.price_change_percentage_24h)}</div>
            <div class="mt-2">${scoreBadge(calculateTokenScore(coin, selectedFullCoin))}</div>
          </div>
        </div>
      `;
    }

    async function selectCoin(coinId) {
      selectedCoinId = coinId;
      selectedMarketCoin = allTokens.find(t => t.id === coinId) || selectedMarketCoin;
      selectedFullCoin = null;
      activeTab = 'overview';
      tabBarEl.classList.remove('hidden');
      renderTokenList();
      if (selectedMarketCoin) renderHeader(selectedMarketCoin);
      renderActiveTab();
    }

    async function ensureFullCoin() {
      if (selectedFullCoin) return selectedFullCoin;
      const cached = loadDetailCache(selectedCoinId);
      if (cached) {
        selectedFullCoin = cached;
        return cached;
      }
      detailCardsEl.innerHTML = card('Caricamento', '<div class="text-slate-400">Caricamento dettagli avanzati...</div>');
      const full = await fetchJsonWithRetry(`${API}/coins/${encodeURIComponent(selectedCoinId)}?localization=false&tickers=false&market_data=true&community_data=true&developer_data=false&sparkline=false`, { retries: 1, retryDelay: 1200 });
      selectedFullCoin = full;
      saveDetailCache(selectedCoinId, full);
      renderHeader(selectedMarketCoin);
      return full;
    }

    function renderOverview() {
      const coin = selectedMarketCoin;
      const volMcap = getVolumeToMcap(coin);
      const score = calculateTokenScore(coin, selectedFullCoin);
      detailCardsEl.innerHTML = card('Overview veloce', `
        <div class="grid md:grid-cols-3 gap-4">
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">${statItem('Market Cap', formatCurrency(coin.market_cap))}</div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">${statItem('Volume 24h', formatCurrency(coin.total_volume))}</div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">${statItem('FDV', formatCurrency(coin.fully_diluted_valuation))}</div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">${statItem('Vol/MCap', volMcap ? formatPercent(volMcap * 100) : 'N/A')}</div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">${statItem('24h', `<span class="${percentClass(coin.price_change_percentage_24h)}">${formatPercent(coin.price_change_percentage_24h)}</span>`)}</div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">${statItem('Smart Score', scoreBadge(score))}</div>
        </div>
        <div class="mt-5 text-slate-400 text-sm">Lo score è frontend-only e combina market cap, volume/market cap, FDV ratio, trend 24h/7d/30d e watchlist quando disponibile.</div>
      `);
    }

    async function renderStatistics() {
      try {
        const full = await ensureFullCoin();
        const md = full.market_data || {};
        const community = full.community_data || {};
        const mcap = md.market_cap?.usd ?? selectedMarketCoin.market_cap;
        const fdv = md.fully_diluted_valuation?.usd ?? selectedMarketCoin.fully_diluted_valuation;
        const ratio = mcap && fdv ? (mcap / fdv).toFixed(2) : 'N/A';
        detailCardsEl.innerHTML = card('Statistics', `<div class="grid md:grid-cols-2 gap-x-10 gap-y-7">
          ${statItem('Market Cap', formatCurrency(mcap))}
          ${statItem('Circulating Supply', formatNumber(md.circulating_supply))}
          ${statItem('Fully Diluted Valuation', formatCurrency(fdv))}
          ${statItem('Total Supply', formatNumber(md.total_supply))}
          ${statItem('Market Cap / FDV Ratio', ratio)}
          ${statItem('Max Supply', formatNumber(md.max_supply))}
          ${statItem('Trading Volume 24h', formatCurrency(md.total_volume?.usd ?? selectedMarketCoin.total_volume))}
          ${statItem('Added to Watchlist', formatNumber(community.watchlist_portfolio_users))}
        </div>`);
      } catch { detailCardsEl.innerHTML = card('Statistics', '<div class="text-slate-400">Dettagli non disponibili. Probabile rate limit.</div>'); }
    }

    async function renderHistorical() {
      try {
        const full = await ensureFullCoin();
        const md = full.market_data || {};
        detailCardsEl.innerHTML = card('Historical Data', `<div class="grid md:grid-cols-2 gap-x-10 gap-y-7">
          ${statItem('24H High', formatPrice(md.high_24h?.usd))}
          ${statItem('24H Low', formatPrice(md.low_24h?.usd))}
          ${statItem('All Time High', `<span>${formatPrice(md.ath?.usd)}</span> <span class="${percentClass(md.ath_change_percentage?.usd)} text-base">${formatPercent(md.ath_change_percentage?.usd)}</span>`, formatDate(md.ath_date?.usd))}
          ${statItem('All Time Low', `<span>${formatPrice(md.atl?.usd)}</span> <span class="${percentClass(md.atl_change_percentage?.usd)} text-base">${formatPercent(md.atl_change_percentage?.usd)}</span>`, formatDate(md.atl_date?.usd))}
        </div><div id="historyBox" class="mt-6"></div>`);
        await renderHistoryTable();
      } catch { detailCardsEl.innerHTML = card('Historical Data', '<div class="text-slate-400">Storico non disponibile.</div>'); }
    }

    async function renderHistoryTable() {
      const box = document.getElementById('historyBox');
      if (!box) return;
      box.innerHTML = '<div class="text-slate-400 mb-3">Caricamento tabella storico...</div>';
      const days = daysSelectEl.value;
      let chartData = null;
      let loadedFromCache = false;
      try {
        chartData = await fetchJsonWithRetry(`${API}/coins/${encodeURIComponent(selectedCoinId)}/market_chart?vs_currency=usd&days=${days}`, { retries: 1, retryDelay: 1500 });
        saveHistoryToCache(selectedCoinId, days, chartData);
      } catch {
        const cached = loadHistoryFromCache(selectedCoinId, days);
        if (cached) { chartData = cached; loadedFromCache = true; } else { throw new Error('NO_HISTORY'); }
      }
      const rows = buildDailyRowsFromChartData(chartData);
      box.innerHTML = `
        <div class="flex justify-between items-center mb-3"><div class="text-slate-400 text-sm">${rows.length} righe ${loadedFromCache ? '· cache locale' : ''}</div></div>
        <div class="overflow-auto rounded-xl border border-slate-800">
          <table class="min-w-full text-sm">
            <thead class="bg-slate-950 text-slate-300 sticky top-0"><tr><th class="text-left px-4 py-3">Data</th><th class="text-right px-4 py-3">Market Cap</th><th class="text-right px-4 py-3">Volume</th><th class="text-right px-4 py-3">Close</th></tr></thead>
            <tbody>${rows.map((row, idx) => `<tr class="${idx % 2 === 0 ? 'bg-slate-900' : 'bg-slate-950'} border-t border-slate-800"><td class="px-4 py-3 whitespace-nowrap">${escapeHtml(row.date)}</td><td class="px-4 py-3 text-right whitespace-nowrap">${formatCurrency(row.marketCap)}</td><td class="px-4 py-3 text-right whitespace-nowrap">${formatCurrency(row.volume)}</td><td class="px-4 py-3 text-right whitespace-nowrap">${formatPrice(row.close)}</td></tr>`).join('')}</tbody>
          </table>
        </div>`;
    }

    async function renderContracts() {
      try {
        const full = await ensureFullCoin();
        const platforms = full.platforms || {};
        const chainNames = { ethereum: 'Ethereum', base: 'Base', 'binance-smart-chain': 'Binance Smart Chain', mantle: 'Mantle', polygon: 'Polygon', arbitrum: 'Arbitrum', optimism: 'Optimism', avalanche: 'Avalanche', solana: 'Solana' };
        const rows = Object.entries(platforms).filter(([, address]) => address).map(([chain, address]) => `<div class="flex items-center justify-between gap-3 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3"><div class="font-medium">${escapeHtml(chainNames[chain] || chain)}</div><button class="copy-btn text-slate-300 hover:text-white text-sm" data-copy="${escapeHtml(address)}">${escapeHtml(shortAddress(address))} 📋</button></div>`).join('');
        detailCardsEl.innerHTML = card('Contract Address', `<div class="space-y-3">${rows || '<div class="text-slate-500">Nessun contract address disponibile.</div>'}</div>`);
        document.querySelectorAll('.copy-btn').forEach(btn => btn.addEventListener('click', async () => { await navigator.clipboard.writeText(btn.getAttribute('data-copy')); const old = btn.textContent; btn.textContent = 'Copiato ✅'; setTimeout(() => btn.textContent = old, 1200); }));
      } catch { detailCardsEl.innerHTML = card('Contract Address', '<div class="text-slate-400">Contract non disponibili.</div>'); }
    }

    async function renderLinks() {
      try {
        const full = await ensureFullCoin();
        const links = full.links || {};
        const homepage = Array.isArray(links.homepage) ? links.homepage.find(Boolean) : null;
        const twitter = links.twitter_screen_name ? `https://x.com/${links.twitter_screen_name}` : null;
        const telegram = links.telegram_channel_identifier ? `https://t.me/${links.telegram_channel_identifier}` : null;
        const discord = Array.isArray(links.chat_url) ? links.chat_url.find(url => String(url).includes('discord')) : null;
        const github = Array.isArray(links.repos_url?.github) ? links.repos_url.github.find(Boolean) : null;
        const explorers = Array.isArray(links.blockchain_site) ? links.blockchain_site.filter(Boolean).slice(0, 4) : [];
        const items = [['Website', homepage], ['X / Twitter', twitter], ['Telegram', telegram], ['Discord', discord], ['GitHub', github], ['CoinGecko', `https://www.coingecko.com/en/coins/${full.id}`], ...explorers.map((url, i) => [`Explorer ${i + 1}`, url])].filter(([, url]) => !!url);
        const body = items.length ? items.map(([label, url]) => `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between gap-3 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 hover:border-emerald-500 transition"><span class="text-slate-300">${escapeHtml(label)}</span><span class="text-emerald-400 text-sm truncate max-w-[70%]">${escapeHtml(url)}</span></a>`).join('') : '<div class="text-slate-500">Nessun link disponibile.</div>';
        detailCardsEl.innerHTML = card('Links', `<div class="space-y-3">${body}</div>`);
      } catch { detailCardsEl.innerHTML = card('Links', '<div class="text-slate-400">Links non disponibili.</div>'); }
    }

    async function renderActiveTab() {
      if (!selectedMarketCoin) return;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const on = btn.getAttribute('data-tab') === activeTab;
        btn.className = on ? 'tab-btn bg-emerald-700 rounded-xl px-4 py-3 font-semibold' : 'tab-btn bg-slate-800 hover:bg-slate-700 rounded-xl px-4 py-3 font-semibold';
      });
      if (activeTab === 'overview') renderOverview();
      if (activeTab === 'statistics') await renderStatistics();
      if (activeTab === 'historical') await renderHistorical();
      if (activeTab === 'contracts') await renderContracts();
      if (activeTab === 'links') await renderLinks();
    }

    function getHistoryCacheKey(coinId, days) { return `cg_history_${coinId}_${days}`; }
    function saveHistoryToCache(coinId, days, data) { try { localStorage.setItem(getHistoryCacheKey(coinId, days), JSON.stringify({ savedAt: Date.now(), data })); } catch {} }
    function loadHistoryFromCache(coinId, days, maxAgeMs = 1000 * 60 * 30) { try { const parsed = JSON.parse(localStorage.getItem(getHistoryCacheKey(coinId, days)) || 'null'); if (!parsed?.savedAt || !parsed?.data) return null; if (Date.now() - parsed.savedAt > maxAgeMs) return null; return parsed.data; } catch { return null; } }

    function buildDailyRowsFromChartData(chartData) {
      const prices = Array.isArray(chartData?.prices) ? chartData.prices : [];
      const marketCaps = Array.isArray(chartData?.market_caps) ? chartData.market_caps : [];
      const volumes = Array.isArray(chartData?.total_volumes) ? chartData.total_volumes : [];
      const dailyMap = new Map();
      prices.forEach((pricePoint, index) => {
        const timestamp = pricePoint[0];
        const date = new Date(timestamp).toISOString().slice(0, 10);
        dailyMap.set(date, { timestamp, close: pricePoint[1], marketCap: marketCaps[index] ? marketCaps[index][1] : null, volume: volumes[index] ? volumes[index][1] : null });
      });
      return Array.from(dailyMap.entries()).map(([date, values]) => ({ date, ...values })).sort((a, b) => b.timestamp - a.timestamp);
    }

    refreshBtnEl.addEventListener('click', async () => fetchMarkets(true));
    loadMoreBtnEl.addEventListener('click', async () => { page += 1; await fetchMarkets(false); });
    showMoreLocalBtnEl.addEventListener('click', () => { visibleLimit += 80; renderTokenList(); });

    searchInputEl.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { visibleLimit = INITIAL_RENDER_LIMIT; renderTokenList(); }, 250); });
    minMcapEl.addEventListener('input', () => { visibleLimit = INITIAL_RENDER_LIMIT; renderTokenList(); });
    maxMcapEl.addEventListener('input', () => { visibleLimit = INITIAL_RENDER_LIMIT; renderTokenList(); });

    showAllBtnEl.addEventListener('click', () => { showFavoritesOnly = false; smartFilter = 'none'; visibleLimit = INITIAL_RENDER_LIMIT; renderTokenList(); });
    showFavBtnEl.addEventListener('click', () => { showFavoritesOnly = true; visibleLimit = INITIAL_RENDER_LIMIT; renderTokenList(); });
    smartLowCapBtnEl.addEventListener('click', () => { smartFilter = smartFilter === 'lowcap' ? 'none' : 'lowcap'; visibleLimit = INITIAL_RENDER_LIMIT; renderTokenList(); });
    smartVolumeBtnEl.addEventListener('click', () => { smartFilter = smartFilter === 'highvol' ? 'none' : 'highvol'; visibleLimit = INITIAL_RENDER_LIMIT; renderTokenList(); });

    sortByEl.addEventListener('change', async () => fetchMarkets(true));
    daysSelectEl.addEventListener('change', async () => { if (selectedCoinId && activeTab === 'historical') await renderHistorical(); });

    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', async () => { activeTab = btn.getAttribute('data-tab'); await renderActiveTab(); }));

    installBtnEl.addEventListener('click', async () => {
      if (!deferredPrompt) { installStatusEl.textContent = 'Apri il menu del browser e usa “Aggiungi a schermata Home”.'; return; }
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      installStatusEl.textContent = choice.outcome === 'accepted' ? 'Installazione avviata.' : 'Installazione annullata.';
      installBtnEl.classList.add('hidden');
    });

    setupPWA();
    const freshCache = loadMarketsCache();
    if (!freshCache) fetchMarkets(!allTokens.length, !!allTokens.length);
  </script>
</body>
</html>
